<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=auto_stories,light_mode" />
    <link rel="stylesheet" href="assets\css\style.css">
    <title>Mood Journal</title>
</head>

<body>
    <header>
        <h2>My Mood Journal</h2>
        <span id="darkMode" class="material-symbols-outlined">light_mode</span>
    </header>
    <Main>
        <div class="diary">
            <span class="material-symbols-outlined">auto_stories</span>
            <h1>My Entries</h1>

        </div><br><br>
        <div class="formDiv"">
            <h3>How you've been holding up?</h3><br>
            <form id=" form-entries" action="">
            <label for="dayTitle">Title of the day:</label>
            <input type="text" id="dayTitle" name="dayTitle">
            <label for="rate">Rating of the day:</label>
            <select name="quality" id="dayQuality">
                <option value="">--Please rate your day--</option>
                <option value="Good">Good</option>
                <option value="Avarage">Avarage</option>
                <option value="Bad">Bad</option>
            </select>
            <label for="mood">Mood of the day:</label>

            <select name="mood" id="dayMood">
                <option value="">--Please enter your mood--</option>
                <option value="anxious">
                    <span class="anxious" aria-hidden="true">😬</span>
                    <span class="option-label">Anxious</span>
                </option>
                <option value="depressed">
                    <span class="icon" aria-hidden="true">😞</span>
                    <span class="option-label">Depressed</span>
                </option>
                <option value="moody">
                    <span class="icon" aria-hidden="true">🥴</span>
                    <span class="option-label">Moody</span>
                </option>
                <option value="angry">
                    <span class="icon" aria-hidden="true">😠</span>
                    <span class="option-label">Angry</span>
                </option>
                <option value="happy">
                    <span class="icon" aria-hidden="true">☺️</span>
                    <span class="option-label">Happy</span>
                </option>
            </select>

            <button class="submit" type="button">Submit</button>
            </form>
        </div><br><br>
        <div>
            <div class="entryDiv">
                <h4>The best day of my life</h4>
                <span>Good</span>
                <span>Moody</span>
                <button class="Btn2" type="button">Modifica</button>
                <button class="Btn2" type="button">Elimina</button>
            </div>
        </div>

    </Main><br><br>
    <footer>
        <p>Keep connecting with yourself</p>
    </footer>








    <script src="script.js"></script>
</body>

</html>
